syntax = "proto3";

package nimbuscore.v1;

option go_package = "github.com/gh0st-nemesis/nimbuscore/api/v1;v1";

message ObjectMeta {
  string name = 1;
  string namespace = 2;
  string uid = 3;
  string resource_version = 4;
  map<string, string> labels = 5;
  int64 created_at_unix = 6;
}

message ResourceList {
  int64 cpu_millis = 1;
  int64 memory_bytes = 2;
  map<string, int64> accelerators = 3;
}

message ResourceRequirements {
  ResourceList requests = 1;
  ResourceList limits = 2;
}

message Condition {
  string type = 1;
  string status = 2;
  string reason = 3;
  string message = 4;
  int64 last_transition_unix = 5;
}
