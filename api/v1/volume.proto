syntax = "proto3";

package nimbuscore.v1;

import "common.proto";

option go_package = "github.com/gh0st-nemesis/nimbuscore/api/v1;v1";

enum VolumePhase {
  VOLUME_PHASE_UNSPECIFIED = 0;
  VOLUME_PHASE_PENDING = 1;
  VOLUME_PHASE_BOUND = 2;
  VOLUME_PHASE_FAILED = 3;
}

message VolumeSpec {
  int64 requested_bytes = 1;
}

message VolumeStatus {
  VolumePhase phase = 1;
  int64 capacity_bytes = 2;
  string message = 3;
  string node_name = 4;
}

message Volume {
  ObjectMeta metadata = 1;
  VolumeSpec spec = 2;
  VolumeStatus status = 3;
}

message VolumeMount {
  string volume_name = 1;
  string mount_path = 2;
  bool read_only = 3;
}

service VolumeService {
  rpc CreateVolume(CreateVolumeRequest) returns (Volume);
  rpc GetVolume(GetVolumeRequest) returns (Volume);
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);
  rpc DeleteVolume(DeleteVolumeRequest) returns (DeleteVolumeResponse);
}

message CreateVolumeRequest {
  Volume volume = 1;
}

message GetVolumeRequest {
  string namespace = 1;
  string name = 2;
}

message ListVolumesRequest {
  string namespace = 1;
}

message ListVolumesResponse {
  repeated Volume items = 1;
}

message DeleteVolumeRequest {
  string namespace = 1;
  string name = 2;
}

message DeleteVolumeResponse {}
