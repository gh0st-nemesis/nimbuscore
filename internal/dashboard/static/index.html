<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NimbusCore</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>NimbusCore</h1>
  <span id="clock"></span>
</header>

<main>
  <section>
    <h2>Nodes <span class="count" id="nodes-count">0</span></h2>
    <table id="nodes-table">
      <thead><tr><th>Name</th><th>Ready</th><th>Internal IP</th><th>CPU</th><th>Memory</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section>
    <h2>Pods <span class="count" id="pods-count">0</span></h2>
    <table id="pods-table">
      <thead><tr><th>Namespace</th><th>Name</th><th>Phase</th><th>Node</th><th>Restarts</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section>
    <h2>Deployments <span class="count" id="deployments-count">0</span></h2>
    <table id="deployments-table">
      <thead><tr><th>Namespace</th><th>Name</th><th>Replicas</th><th>Ready</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section>
    <h2>Services <span class="count" id="services-count">0</span></h2>
    <table id="services-table">
      <thead><tr><th>Namespace</th><th>Name</th><th>Port</th><th>Endpoints</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section>
    <h2>FinOps</h2>
    <div id="finops-summary" class="cards"></div>
  </section>
</main>

<footer>auto-refresh every 5s</footer>
<script src="app.js"></script>
</body>
</html>
