<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — NimbusCore</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
<div class="login-card">
  <div class="login-brand">
    <img src="logo.png" alt="NimbusCore">
    <div class="brand-text">
      <span class="brand-name">Nimbus<em>Core</em></span>
      <span class="brand-sub">cluster dashboard</span>
    </div>
  </div>

  <form id="login-form">
    <label>Username <input name="username" autocomplete="username" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" id="login-submit-btn" class="btn-primary login-submit">Sign in</button>
    <p id="login-error" class="form-error"></p>
  </form>
</div>
<script src="particles.js"></script>
<script src="login.js"></script>
</body>
</html>
